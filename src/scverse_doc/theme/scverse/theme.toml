[theme]
inherit = "pydata_sphinx_theme"
stylesheets = [
    "styles/scverse.css",
]
pygments_style = { default = "tango" }
sidebars = ["navbar-logo", "search-button-field", "scverse-sidebar-nav"]

[options]
package = ""
accent = ""
secondary_accent = false
show_ecosystem_dropdown = true
# No navbar: its parts live in the primary sidebar and the article header.
navbar_start = []
navbar_center = []
navbar_end = []
navbar_persistent = []
article_header_start = ["toggle-primary-sidebar", "breadcrumbs"]
article_header_end = ["theme-switcher", "navbar-icon-links", "scverse-ecosystem", "toggle-secondary-sidebar"]
primary_sidebar_end = ["sidebar-ethical-ads", "sidebar-versions"]
secondary_sidebar_items = ["page-toc", "edit-this-page", "sourcelink"]
footer_start = ["scverse-footer"]
footer_center = []
footer_end = []
show_toc_level = 2
navigation_depth = 3
collapse_navigation = false
pygments_light_style = "tango"
pygments_dark_style = "monokai"
announcement = "https://scverse.org/announcement.html"
