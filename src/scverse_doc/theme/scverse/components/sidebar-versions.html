<readthedocs-flyout></readthedocs-flyout>
<script type="module">
// flyout.css hardcodes `.container { position: fixed }` with no part/variable to override it
customElements.whenDefined("readthedocs-flyout").then(() => {
    const sheet = new CSSStyleSheet()
    sheet.replaceSync(
        ".container { position: static; max-width: none; max-height: none; }",
    )
    for (const { shadowRoot } of document.querySelectorAll(
        "readthedocs-flyout",
    )) {
        shadowRoot.adoptedStyleSheets = [
            ...shadowRoot.adoptedStyleSheets,
            sheet,
        ]
    }
})
</script>
