[theme]
inherit = pydata_sphinx_theme
stylesheet = styles/scverse.css
pygments_style = tango

[options]
# Everything below is set by scverse_doc.config.theme_options(); packages are not expected to set these by hand.
# Base-theme options keep their upstream names and defaults, so anything not listed here is pydata's.
scverse_package =
scverse_accent =
scverse_show_ecosystem_dropdown = True
