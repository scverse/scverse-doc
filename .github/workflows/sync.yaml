name: Sync data

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - src/scverse_doc/theme/scverse/static/_tokens.css
      - src/scverse_doc/theme/scverse/static/scverse-fa.svg
      - scripts/**

permissions:
  contents: read

jobs:
  regenerate:
    name: Generated files match upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: scverse/scverse.github.io
          path: .upstream/website
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv run scripts/sync_brand_tokens.py --website .upstream/website --check
