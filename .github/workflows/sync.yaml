name: Sync data

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - src/scverse_doc/theme/scverse/static/styles/_tokens.css
      - src/scverse_doc/theme/scverse/static/scverse-fa.svg
      - src/scverse_doc/static/mathmlfixes.css
      - scripts/**

permissions:
  contents: read

jobs:
  regenerate:
    name: Generated files match upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: scverse/scverse.github.io
          path: .upstream/website
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tmke8/math-core
          path: .upstream/math-core
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv run scripts/sync_upstream.py --website .upstream/website --math-core .upstream/math-core --check
