name: Registry

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - src/scverse_doc/registry.json
      - scripts/build_registry.py

permissions:
  contents: read

jobs:
  regenerate:
    name: Registry matches upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: scverse/ecosystem-packages
          path: .upstream/ecosystem-packages
      - uses: actions/checkout@v5
        with:
          repository: scverse/scverse.github.io
          path: .upstream/website
      - uses: astral-sh/setup-uv@v7
      - run: uv run --with pyyaml scripts/build_registry.py
          --ecosystem .upstream/ecosystem-packages --website .upstream/website --check
      - run: uv run scripts/sync_brand_tokens.py --website .upstream/website --check

  inventories:
    name: Inventories are reachable
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - id: check
        run: uv run scripts/check_inventories.py --core-only | tee $GITHUB_STEP_SUMMARY
      - if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v8
        with:
          script: |
            const title = "Broken intersphinx inventory in the package registry"
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: ["registry"],
            })
            if (!existing.data.some(issue => issue.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, labels: ["registry"],
                body: `A registry inventory stopped resolving. See ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}.`,
              })
            }
