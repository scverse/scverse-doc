name: PR
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions: {}
jobs:
  check-title:
    name: Check title
    runs-on: ubuntu-slim
    permissions:
      pull-requests: read
    steps:
      # The squash-merged title is the commit message release-please builds the changelog from
      - uses: amannn/action-semantic-pull-request@v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
