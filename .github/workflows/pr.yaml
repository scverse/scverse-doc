name: PR
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions: {}
jobs:
  check-title:
    name: Check title
    runs-on: ubuntu-latest
    steps:
      # The squash-merged title is the commit message release-please builds the changelog from
      - run: |
          grep -Eq '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^)]+\))?!?: .+' <<< "$TITLE" \
            || { echo "::error::PR title “$TITLE” isn’t a conventional commit, e.g. “fix(theme): make logo fill sidebar”"; exit 1; }
        env:
          TITLE: ${{ github.event.pull_request.title }}
